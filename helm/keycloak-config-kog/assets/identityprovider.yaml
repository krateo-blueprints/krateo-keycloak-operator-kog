openapi: 3.0.3
info:
  title: Keycloak Admin API - Identity Provider (KOG subset)
  version: v1
  description: Hand-curated OpenAPI 3.0 subset of the Keycloak Admin REST API for the Identity Provider
    resource, sufficient to manage it through the Krateo Operator Generator (KOG). Declares the http/bearer
    security scheme that the upstream Keycloak OAS omits.
servers:
- url: '{{ .Values.keycloak.baseUrl }}'
  description: Keycloak base URL (no trailing slash).
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Keycloak admin access token (OAuth2 Bearer).
  schemas:
    IdentityProviderRepresentation:
      type: object
      required:
      - alias
      properties:
        alias:
          type: string
          description: IdP alias. Immutable natural key.
        displayName:
          type: string
        providerId:
          type: string
          description: e.g. oidc, keycloak-oidc, saml, github
        enabled:
          type: boolean
        trustEmail:
          type: boolean
        storeToken:
          type: boolean
        linkOnly:
          type: boolean
        hideOnLogin:
          type: boolean
        firstBrokerLoginFlowAlias:
          type: string
        config:
          type: object
          description: Provider settings (clientId, authorizationUrl, ...). Do NOT put clientSecret
            here; reference it with clientSecretRef so it never sits in the custom resource.
          additionalProperties:
            type: string
        clientSecretRef:
          $ref: '#/components/schemas/SecretKeySelector'
        internalId:
          type: string
          description: Server-generated identifier (read-only).
          readOnly: true
    SecretKeySelector:
      type: object
      description: The IdP client secret, as a key in a Secret in the custom resource's OWN namespace.
        The controller writes its value into config.clientSecret on create and update; the custom
        resource carries only this reference. Not a Keycloak field.
      required:
      - name
      - key
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
        key:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[-._a-zA-Z0-9]+$'
paths:
  /admin/realms/{realm}/identity-provider/instances:
    post:
      operationId: createIdentityprovider
      summary: Create Identity Provider
      tags:
      - identityprovider
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        '201':
          description: Created. Identifier returned via Location header.
    get:
      operationId: listIdentityprovider
      summary: List/find Identity Provider
      tags:
      - identityprovider
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderRepresentation'
  /admin/realms/{realm}/identity-provider/instances/{alias}:
    get:
      operationId: getIdentityprovider
      summary: Get Identity Provider
      tags:
      - identityprovider
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: alias
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderRepresentation'
    put:
      operationId: updateIdentityprovider
      summary: Update Identity Provider
      tags:
      - identityprovider
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: alias
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        '204':
          description: Updated.
    delete:
      operationId: deleteIdentityprovider
      summary: Delete Identity Provider
      tags:
      - identityprovider
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: alias
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
