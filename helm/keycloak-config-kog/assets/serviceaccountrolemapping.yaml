openapi: 3.0.3
info:
  title: Keycloak Admin API - Service Account Role Mapping (KOG subset)
  version: v1
  description: Hand-curated OpenAPI 3.0 subset of the Keycloak Admin REST API for the CLIENT-role
    mappings of one client's SERVICE-ACCOUNT user. Keycloak has no call that replaces a role set
    (POST adds roles, DELETE removes the roles in its body) and addresses the service-account user
    and the role-owning client only by server UUIDs, so the RestDefinition delegates its lifecycle
    to Snowplow RESTActions (observeApiRef/createApiRef/updateApiRef/deleteApiRef) that resolve
    both by clientId and converge the EXACT set. This OAS exists to (a) generate the CRD spec shape
    from the create request body, (b) type the observe-composed status fields, and (c) declare the
    get used to verify deletion before the finalizer is released. Declares the http/bearer security
    scheme that the upstream Keycloak OAS omits.
    NOTE - this asset is hand-maintained (not emitted by hack/gen_oas_assets.py).
servers:
- url: '{{ .Values.keycloak.baseUrl }}'
  description: Keycloak base URL (no trailing slash).
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Keycloak admin access token (OAuth2 Bearer).
  schemas:
    ServiceAccountRoleMappingInput:
      type: object
      description: The exact set of roles of ONE client (roleClientId) that the service-account user
        of another client (clientId) holds as direct mappings. The CR owns that whole set - roles of
        roleClientId mapped by hand are removed, and deleting the CR removes every direct mapping of
        roleClientId's roles from the service account. The natural key is (realm, clientId,
        roleClientId); those fields are effectively CREATE-ONLY - changing them re-targets the
        reconcile and leaves the old mappings in place. The client must exist with
        serviceAccountsEnabled true; until it does the CR stays unready and retries.
      required:
      - clientId
      - roleClientId
      - roles
      properties:
        clientId:
          type: string
          minLength: 1
          description: clientId (not the UUID) of the client whose service-account user receives the
            roles, e.g. identity-lifecycle.
        roleClientId:
          type: string
          minLength: 1
          description: clientId of the client that owns the roles, e.g. realm-management for the
            realm admin roles.
        roles:
          type: array
          uniqueItems: true
          description: Names of roleClientId's client roles the service account must hold, e.g.
            manage-users, view-users, query-groups. Compared as a set. A name that does not exist on
            roleClientId cannot be granted and keeps the CR unready.
          items:
            type: string
            minLength: 1
    RoleRepresentation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        composite:
          type: boolean
        clientRole:
          type: boolean
        containerId:
          type: string
    ServiceAccountRoleMappingStatus:
      type: object
      description: Typing for the generated CRD's STATUS. oasgen resolves additionalStatusFields
        against the get response schema, and these fields are composed by the observe RESTAction
        rather than returned by Keycloak. The live get (delete verification only) answers a JSON
        ARRAY of RoleRepresentation; the RestDefinition's notFoundBody reads an empty array as gone.
      properties:
        found:
          type: boolean
          description: Synthetic - whether the client, its service-account user and the role-owning
            client were all found.
        userId:
          type: string
          description: Synthetic - id of the client's service-account user.
        roleClientUuid:
          type: string
          description: Synthetic - id of the role-owning client.
        roles:
          type: array
          description: Synthetic - roleClientId's roles the service account currently holds as
            direct mappings, sorted.
          items:
            type: string
paths:
  /admin/realms/{realm}/users/{userId}/role-mappings/clients/{roleClientUuid}:
    post:
      operationId: createServiceaccountrolemapping
      summary: Add client-role mappings to the service-account user (the RESTActions send the
        RoleRepresentation array Keycloak expects; this body only shapes the CRD)
      tags:
      - serviceaccountrolemapping
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: Service-account user id (resolved by the RESTActions, never part of the spec).
      - name: roleClientUuid
        in: path
        required: true
        schema:
          type: string
        description: Role-owning client id (resolved by the RESTActions, never part of the spec).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountRoleMappingInput'
      responses:
        '204':
          description: Roles added.
    get:
      operationId: getServiceaccountrolemapping
      summary: Direct client-role mappings of the service-account user (delete verification)
      tags:
      - serviceaccountrolemapping
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: Resolved from status.userId.
      - name: roleClientUuid
        in: path
        required: true
        schema:
          type: string
        description: Resolved from status.roleClientUuid.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRoleMappingStatus'
