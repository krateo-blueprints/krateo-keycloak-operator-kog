openapi: 3.0.3
info:
  title: Keycloak Admin API - Realm (KOG subset)
  version: v1
  description: Hand-curated OpenAPI 3.0 subset of the Keycloak Admin REST API for the Realm resource,
    sufficient to manage it through the Krateo Operator Generator (KOG). Declares the http/bearer security
    scheme that the upstream Keycloak OAS omits.
servers:
- url: '{{ .Values.keycloak.baseUrl }}'
  description: Keycloak base URL (no trailing slash).
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Keycloak admin access token (OAuth2 Bearer).
  schemas:
    SmtpCredentialsRef:
      type: object
      description: The SMTP user and password, as two keys of ONE Secret in the custom resource's OWN
        namespace. The controller writes them into smtpServer.user and smtpServer.password on create
        and update; the custom resource carries only this reference. Keycloak returns the password
        masked, so it is never compared. Not a Keycloak field.
      required:
      - name
      - userKey
      - passwordKey
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
        userKey:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[-._a-zA-Z0-9]+$'
        passwordKey:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[-._a-zA-Z0-9]+$'
    RealmRepresentation:
      type: object
      required:
      - realm
      properties:
        realm:
          type: string
          description: Realm name. Immutable natural key.
        enabled:
          type: boolean
        displayName:
          type: string
        displayNameHtml:
          type: string
        sslRequired:
          type: string
          description: 'one of: all, external, none'
        loginTheme:
          type: string
        loginWithEmailAllowed:
          type: boolean
        registrationAllowed:
          type: boolean
        resetPasswordAllowed:
          type: boolean
        verifyEmail:
          type: boolean
          description: Require users to verify their email address (the VERIFY_EMAIL required action at first login).
        actionTokenGeneratedByAdminLifespan:
          type: integer
          format: int32
          minimum: 1
          description: Lifetime in seconds of action links an administrator sends (execute-actions email,
            e.g. the set-password link of a new account). Keycloak's default is 43200 (12 hours).
        actionTokenGeneratedByUserLifespan:
          type: integer
          format: int32
          minimum: 1
          description: Lifetime in seconds of action links a user triggers (e.g. forgot password).
        smtpServer:
          type: object
          description: Outgoing mail server for this realm (set-password, verify-email and forgot-password
            emails). All values are strings, as Keycloak stores them. The SMTP user and password are NOT
            set here; reference them with smtpCredentialsRef so they never sit in the custom resource.
          additionalProperties: false
          properties:
            host:
              type: string
              minLength: 1
            port:
              type: string
              pattern: '^[0-9]{1,5}$'
            from:
              type: string
              minLength: 3
              description: Envelope and header From address.
            fromDisplayName:
              type: string
            replyTo:
              type: string
            replyToDisplayName:
              type: string
            envelopeFrom:
              type: string
            auth:
              type: string
              enum:
              - "true"
              - "false"
              description: '"true" to authenticate with the credentials from smtpCredentialsRef.'
            starttls:
              type: string
              enum:
              - "true"
              - "false"
            ssl:
              type: string
              enum:
              - "true"
              - "false"
        smtpCredentialsRef:
          $ref: '#/components/schemas/SmtpCredentialsRef'
        eventsEnabled:
          type: boolean
          description: Store user events (login, SEND_EXECUTE_ACTIONS, SEND_ERROR, ...).
        enabledEventTypes:
          type: array
          description: The user event types to store, e.g. SEND_EXECUTE_ACTIONS and SEND_ERROR.
          items:
            type: string
        eventsListeners:
          type: array
          description: Event listener providers, e.g. jboss-logging (events in the server log).
          items:
            type: string
        eventsExpiration:
          type: integer
          format: int64
          minimum: 1
          description: How long stored user events are kept, in seconds.
        adminEventsEnabled:
          type: boolean
        adminEventsDetailsEnabled:
          type: boolean
        rememberMe:
          type: boolean
        accessTokenLifespan:
          type: integer
        ssoSessionIdleTimeout:
          type: integer
          description: Shared-SSO idle timeout (seconds).
        ssoSessionMaxLifespan:
          type: integer
          description: Shared-SSO max session lifespan (seconds).
        internationalizationEnabled:
          type: boolean
        defaultLocale:
          type: string
        otpPolicyType:
          type: string
          description: totp or hotp.
        otpPolicyAlgorithm:
          type: string
          description: e.g. HmacSHA1, HmacSHA256, HmacSHA512.
        otpPolicyDigits:
          type: integer
          description: Number of digits in the OTP (6 or 8).
        otpPolicyPeriod:
          type: integer
          description: TOTP time step in seconds (e.g. 30).
        otpPolicyLookAheadWindow:
          type: integer
        otpPolicyInitialCounter:
          type: integer
          description: HOTP initial counter.
        otpPolicyCodeReusable:
          type: boolean
        webAuthnPolicyRpEntityName:
          type: string
        webAuthnPolicyRpId:
          type: string
        webAuthnPolicySignatureAlgorithms:
          type: array
          items:
            type: string
        webAuthnPolicyAttestationConveyancePreference:
          type: string
          description: none, indirect or direct.
        webAuthnPolicyAuthenticatorAttachment:
          type: string
          description: platform or cross-platform.
        webAuthnPolicyRequireResidentKey:
          type: string
          description: Yes/No/not specified.
        webAuthnPolicyUserVerificationRequirement:
          type: string
          description: required, preferred or discouraged.
        webAuthnPolicyCreateTimeout:
          type: integer
        webAuthnPolicyAvoidSameAuthenticatorRegister:
          type: boolean
        webAuthnPolicyAcceptableAaguids:
          type: array
          items:
            type: string
        webAuthnPolicyPasswordlessRpEntityName:
          type: string
        webAuthnPolicyPasswordlessRpId:
          type: string
        webAuthnPolicyPasswordlessSignatureAlgorithms:
          type: array
          items:
            type: string
        webAuthnPolicyPasswordlessAttestationConveyancePreference:
          type: string
        webAuthnPolicyPasswordlessAuthenticatorAttachment:
          type: string
        webAuthnPolicyPasswordlessRequireResidentKey:
          type: string
        webAuthnPolicyPasswordlessUserVerificationRequirement:
          type: string
        webAuthnPolicyPasswordlessCreateTimeout:
          type: integer
        webAuthnPolicyPasswordlessAvoidSameAuthenticatorRegister:
          type: boolean
        webAuthnPolicyPasswordlessAcceptableAaguids:
          type: array
          items:
            type: string
        browserFlow:
          type: string
          description: Alias of the realm browser flow (e.g. a managed step-up flow).
        directGrantFlow:
          type: string
          description: Alias of the realm direct-grant flow.
        attributes:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
          description: Server-generated identifier (read-only).
          readOnly: true
paths:
  /admin/realms:
    post:
      operationId: createRealm
      summary: Create Realm
      tags:
      - realm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmRepresentation'
      responses:
        '201':
          description: Created. Identifier returned via Location header.
    get:
      operationId: listRealm
      summary: List/find Realm
      tags:
      - realm
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RealmRepresentation'
  /admin/realms/{realm}:
    get:
      operationId: getRealm
      summary: Get Realm
      tags:
      - realm
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmRepresentation'
    put:
      operationId: updateRealm
      summary: Update Realm
      tags:
      - realm
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmRepresentation'
      responses:
        '204':
          description: Updated.
    delete:
      operationId: deleteRealm
      summary: Delete Realm
      tags:
      - realm
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
