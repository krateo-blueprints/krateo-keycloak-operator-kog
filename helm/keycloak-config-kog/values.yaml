# ---------------------------------------------------------------------------
# Keycloak target
# ---------------------------------------------------------------------------
keycloak:
  # Base URL of the Keycloak server the generated controllers call. No trailing
  # slash. Injected into every OAS asset's `servers[0].url` via Helm `tpl`.
  # In-cluster default points at the Service created by the operator blueprint.
  baseUrl: "http://keycloak-service.keycloak-system.svc.cluster.local:8080"

# ---------------------------------------------------------------------------
# Admin bearer token (delivered + rotated by External Secrets Operator)
# ---------------------------------------------------------------------------
# rest-dynamic-controller reads a bearer token from a Secret referenced by each
# CR's `authenticationRefs`. Keycloak admin access tokens are short-lived, so we
# do NOT store a static token: ESO mints a fresh one from Keycloak's token
# endpoint (client_credentials, service-account client with realm-management
# roles) on a refreshInterval shorter than the token TTL, and writes it here.
auth:
  secretName: keycloak-admin-token
  secretKey: token
  externalSecret:
    enabled: true
    # Must stay well BELOW the access-token lifespan, or a consumer can be handed a token at the
    # instant it expires. Keycloak's master realm defaults to 60 s (measured: exp - iat = 60), so
    # refresh at half of that.
    refreshInterval: "30s"
    # Name of an ESO Generator (preferred) OR SecretStore that yields the token.
    # See templates/externalsecret.yaml for the two supported wiring modes.
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Webhook
      name: keycloak-admin-token-webhook
    # client_credentials inputs the Generator/Webhook uses to mint the token.
    tokenEndpoint: "http://keycloak-service.keycloak-system.svc.cluster.local:8080/realms/master/protocol/openid-connect/token"
    clientId: "krateo-kog"
    # The client secret itself comes from a pre-existing Secret (not in values).
    # Ignored when auth.bootstrap.enabled: the client id and secret then come from the
    # blueprint's bootstrap service account instead.
    clientSecretRef:
      name: keycloak-kog-client
      key: clientSecret
  # Authenticate as the bootstrap admin SERVICE ACCOUNT that krateo-keycloak-blueprint (>= 0.2.3)
  # creates, so a fresh install needs no hand-made client. The chart copies that one Secret from
  # the Keycloak namespace into this one with an ESO Kubernetes SecretStore whose ServiceAccount may
  # `get` ONLY that Secret (resourceNames), and the token generator reads the copy.
  bootstrap:
    enabled: false
    # Namespace of the blueprint's Keycloak, where Secret `secretName` lives. Required when enabled.
    namespace: ""
    # The blueprint's bootstrap service-account Secret (keys client-id, client-secret).
    secretName: keycloak-bootstrap-service

# ---------------------------------------------------------------------------
# Which RestDefinitions to emit. Each maps 1:1 to an assets/<key>.yaml OAS.
# `kind` is intentionally prefixed `Keycloak` to avoid crdgen collisions with
# same-named lowercase body properties (e.g. kind Realm vs property `realm`),
# the same failure mode the Nova KOG hit with kind `Server` vs property `server`.
# ---------------------------------------------------------------------------
restDefinitions:
  realm:
    enabled: true
    kind: KeycloakRealm
  client:
    enabled: true
    kind: KeycloakClient
  protocolmapper:
    enabled: true
    kind: KeycloakProtocolMapper
  clientscope:
    enabled: true
    kind: KeycloakClientScope
  group:
    enabled: true
    kind: KeycloakGroup
  # Realm user, including credentials sourced from a Kubernetes Secret (password + OTP seed)
  # rather than plaintext on the CR. Requires oasgen-provider >= 0.56.0 (which ships
  # rest-dynamic-controller at the same version): the first release that provisions the
  # secretRef Role (oasgen-provider#510) and honours the password-only guard (#524).
  # See the notes in templates/rd-user.yaml.
  user:
    enabled: true
    kind: KeycloakUser
  identityprovider:
    enabled: true
    kind: KeycloakIdentityProvider
  idpmapper:
    enabled: true
    kind: KeycloakIdentityProviderMapper
  # Authentication / MFA config surface (see docs/ARCHITECTURE.md).
  authenticationflow:
    enabled: true
    kind: KeycloakAuthenticationFlow
  requiredaction:
    enabled: true
    kind: KeycloakRequiredAction
  # A realm's declarative user profile (which user attributes exist, who may view/edit them).
  # One document per realm that always exists: the kind adopts it and replaces it on update, and
  # deleting the CR leaves it in place. The CR owns the WHOLE profile. Needs Keycloak >= 24.
  userprofile:
    enabled: true
    kind: KeycloakUserProfile
  # One execution (or subflow) INSIDE a flow. Keycloak's executions API is
  # create-then-mutate (priority honored at create, immutable afterwards), so
  # this RestDefinition delegates its lifecycle verbs to Snowplow RESTActions
  # (observeApiRef/createApiRef/updateApiRef/deleteApiRef) instead of plain OAS
  # verbs. Requires snowplow + authn wired into the rdc deployment
  # (URL_SNOWPLOW/URL_AUTHN + projected authn token - the stock oasgen rdc
  # templates do NOT set these) and the Endpoint-shaped Secret below
  # (snowplow.endpointSecretName).
  authenticationexecution:
    enabled: true
    kind: KeycloakAuthenticationExecution

# ---------------------------------------------------------------------------
# Snowplow delegation (used by restDefinitions.authenticationexecution only)
# ---------------------------------------------------------------------------
snowplow:
  # Name of the snowplow Endpoint-shaped Secret (keys: server-url, token) the
  # KeycloakAuthenticationExecution RESTActions call Keycloak through. Rendered
  # in the release namespace by templates/externalsecret.yaml (same rotated
  # admin token as auth.secretName). If auth.externalSecret.enabled is false,
  # supply this Secret yourself.
  endpointSecretName: keycloak-admin-endpoint

# ---------------------------------------------------------------------------
# Identity + RBAC for the KeycloakAuthenticationExecution path (rendered only when
# restDefinitions.authenticationexecution is enabled). The execution controller authenticates to
# snowplow through authn, so the chart renders its authn ServiceAccount allowlist CR (requires the
# authn CRDs) and least-privilege Roles: the identity may get ONLY this chart's four RESTActions,
# and snowplow may get ONLY the Endpoint Secret.
# ---------------------------------------------------------------------------
executionIdentity:
  enabled: true
  # authn group the controller's identity joins; the RESTAction Role is bound to it.
  group: "krateo:rdc"
  # snowplow's ServiceAccount (namespace defaults to the release namespace).
  snowplowServiceAccount:
    name: snowplow
    namespace: ""

# Kubernetes API group the generated CRDs register under. Resource kinds are <group>/v1 (each OAS
# asset's info.version); their <Kind>Configuration companions are <group>/v1alpha1.
resourceGroup: keycloak.ogen.krateo.io
