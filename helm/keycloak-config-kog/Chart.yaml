apiVersion: v2
name: keycloak-config-kog
description: >-
  Krateo Operator Generator (KOG) packaging that exposes Keycloak Admin API
  resources (realm, client, protocol-mapper, client-scope, group,
  identity-provider) as native Kubernetes custom resources. oasgen-provider +
  rest-dynamic-controller reconcile each CR against a running Keycloak's Admin
  REST API. The bearer admin token is delivered/rotated into a Secret by the
  External Secrets Operator.
type: application
version: CHART_VERSION
appVersion: "26.0"
home: https://www.keycloak.org/
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - security
  - keycloak
  - identity
  - kog
annotations:
  krateo.io/category: security
  krateo.io/display-name: Keycloak Config KOG
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
  # The oasgen-provider this chart needs: 0.62.0 compares the realm's set-typed arrays
  # (enabledEventTypes, eventsListeners) as sets; older releases see Keycloak's reordering as drift.
  krateo.io/requires-oasgen-provider: ">= 0.62.0"
# Helm's `sources` is the source code of THIS chart, and release tooling resolves the chart version
# as a tag in each listed repo. The Keycloak OpenAPI document (an input, vendored under assets/) and
# oasgen-provider (the generator that reads it) are not this chart's source: listing oasgen-provider
# made installer's pin-ci resolve "0.5.1" to an unrelated ancient oasgen-provider tag.
sources:
  - https://github.com/krateo-blueprints/krateo-keycloak-operator-kog
maintainers:
  - name: krateo
