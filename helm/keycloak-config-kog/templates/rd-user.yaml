{{- if .Values.restDefinitions.user.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-user
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-user/user.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ .Values.restDefinitions.user.kind }}
    # `username` is the user-supplied natural key; Keycloak addresses the user by a
    # server-generated UUID. `findby` lists the collection and matches username to
    # resolve {id} (written to status) for get/update/delete. Same pattern as client.
    identifiers:
      - username
    additionalStatusFields:
      - id
    # `id` is server-generated: required path param on get/update/delete, sourced from
    # status (populated by findby); not a user-set spec field.
    excludedSpecFields:
      - id
    verbsDescription:
      - action: findby
        method: GET
        path: /admin/realms/{realm}/users
      - action: create
        method: POST
        path: /admin/realms/{realm}/users
        # Credential VALUES are secret-sourced via RDC secretRef: the CR carries only {name,key}
        # refs and the controller substitutes the Secret's value into the request body, so no
        # plaintext password or OTP seed ever sits on the CR. Verified end-to-end against a live
        # Keycloak — the user authenticates with a password that exists only in the Secret.
        #
        # Credentials are addressed by CONTENT, `[?type=password]` / `[?type=otp]`, not by
        # position, so the CR may list them in either order.
        #
        # CONTROLLER FLOOR (oasgen-provider release, which ships rest-dynamic-controller at the
        # same version): >= 0.56.0 — the first release carrying BOTH
        #   - #510: the provider provisions the per-namespace secretRef Role from the KeycloakUser
        #     instances (0.53.0 – 0.55.x cannot, so NO KeycloakUser reconciles there), and
        #   - #524: the `resolver.when` guard below.
        # Before 0.53.0 (0.20.0 – 0.52.0) secretRef reconciled but every mapping was required,
        # so only users carrying BOTH a password and an OTP credential worked.
        #
        # Each credential mapping is GUARDED on its own entry
        # (`resolver.when.customResourceFieldPresent: spec.credentials[?type=…]`, oasgen-provider#524):
        #   - entry absent        -> the mapping is skipped: no Secret read, nothing in the body. So a
        #                            password-only (or OTP-only) user is valid (#20).
        #   - entry present       -> the ref is REQUIRED as before; an entry with no usable ref fails the
        #                            request loudly, so a user who declared an OTP credential is never
        #                            created password-only.
        #   - two entries of one type -> the selector matches twice and the request fails (no guess).
        # Needs the oasgen-provider release carrying both #510 and #524; older controllers reject or ignore
        # `when` and fail exactly as #20 describes.
        fieldMapping:
          - inBody: credentials[?type=password].value
            inCustomResource: spec.credentials[?type=password].valueSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.credentials[?type=password]
              secretRef:
                nameFromCustomResource: spec.credentials[?type=password].valueSecretRef.name
                keyFromCustomResource: spec.credentials[?type=password].valueSecretRef.key
          - inBody: credentials[?type=otp].secretData
            inCustomResource: spec.credentials[?type=otp].secretDataSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.credentials[?type=otp]
              secretRef:
                nameFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.name
                keyFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.key
      - action: get
        method: GET
        path: /admin/realms/{realm}/users/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /admin/realms/{realm}/users/{id}
        # OTP is enrolled ONCE, at create. Keycloak's PUT /users/{id} refuses to recreate an OTP
        # credential the user already has (HTTP 409 "User exists with same username or email", its
        # generic duplicate message), so re-sending it made EVERY spec update of an OTP user fail.
        # Measured on Keycloak 26.4: a PUT carrying only the password credential returns 204 and
        # leaves the existing OTP in place. So the update body keeps the password (rotation still
        # works) and drops OTP entries. Changing an OTP seed means recreating the KeycloakUser.
        # requestTransform runs after the field mappings have composed the body (RDC >= 0.17.0).
        requestTransform:
          inline: 'if has("credentials") then (.credentials |= map(select(.type != "otp"))) | (if (.credentials | length) == 0 then del(.credentials) else . end) else . end'
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
          - inBody: credentials[?type=password].value
            inCustomResource: spec.credentials[?type=password].valueSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.credentials[?type=password]
              secretRef:
                nameFromCustomResource: spec.credentials[?type=password].valueSecretRef.name
                keyFromCustomResource: spec.credentials[?type=password].valueSecretRef.key
          - inBody: credentials[?type=otp].secretData
            inCustomResource: spec.credentials[?type=otp].secretDataSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.credentials[?type=otp]
              secretRef:
                nameFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.name
                keyFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.key
      - action: delete
        method: DELETE
        path: /admin/realms/{realm}/users/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
{{- end }}
