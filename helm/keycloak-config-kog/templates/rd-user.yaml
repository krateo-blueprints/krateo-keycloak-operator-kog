{{- if .Values.restDefinitions.user.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-user
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
  {{- if .Values.verbose }}
  annotations:
    krateo.io/connector-verbose: "true"
  {{- end }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-user/user.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ .Values.restDefinitions.user.kind }}
    # `username` is the user-supplied natural key; Keycloak addresses the user by a
    # server-generated UUID. `findby` lists the collection and matches username to
    # resolve {id} (written to status) for get/update/delete. Same pattern as client.
    identifiers:
      - username
    additionalStatusFields:
      - id
    # `id` is server-generated: required path param on get/update/delete, sourced from
    # status (populated by findby); not a user-set spec field.
    excludedSpecFields:
      - id
    verbsDescription:
      - action: findby
        method: GET
        path: /admin/realms/{realm}/users
      - action: create
        method: POST
        path: /admin/realms/{realm}/users
        # Credential VALUES are secret-sourced via RDC secretRef: the CR carries only {name,key}
        # refs and the controller substitutes the Secret's value into the request body, so no
        # plaintext password or OTP seed ever sits on the CR. Verified end-to-end against a live
        # Keycloak — the user authenticates with a password that exists only in the Secret.
        #
        # Credentials are addressed by CONTENT, `[?type=password]` / `[?type=otp]`, not by
        # position, so the CR may list them in either order.
        #
        # SUPPORTED CONTROLLER RANGE (oasgen-provider release, which ships rest-dynamic-controller
        # at the same version): 0.20.0 <= version <= 0.52.0.
        #   - 0.20.0 is the first release of the merged repo; it carries content-addressed
        #     paths, unmapped-sibling preservation (before it the OTP credential silently never
        #     registered) and the RDC `secrets` grant secretRef needs. The oasgen-provider chart
        #     must be >= 0.9.11 (RDC ClusterRole grants roles/rolebindings).
        #   - 0.53.0 and later cannot self-provision the secretRef Role, so NO KeycloakUser
        #     reconciles there: krateo-platformops/oasgen-provider#510.
        #
        # KNOWN LIMITATION — BOTH credentials are required today. Every secretRef mapping below
        # is unconditional, so a password-only (or OTP-only) user fails to reconcile with
        # `path "spec.credentials[?type=otp]..." not found on the custom resource`. Fix tracked
        # in #20: an opt-in `when.customResourceFieldPresent` guard on secretRef
        # (krateo-platformops/oasgen-provider#524), which this file adopts once released.
        fieldMapping:
          - inBody: credentials[?type=password].value
            inCustomResource: spec.credentials[?type=password].valueSecretRef
            resolver:
              type: secretRef
              secretRef:
                nameFromCustomResource: spec.credentials[?type=password].valueSecretRef.name
                keyFromCustomResource: spec.credentials[?type=password].valueSecretRef.key
          - inBody: credentials[?type=otp].secretData
            inCustomResource: spec.credentials[?type=otp].secretDataSecretRef
            resolver:
              type: secretRef
              secretRef:
                nameFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.name
                keyFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.key
      - action: get
        method: GET
        path: /admin/realms/{realm}/users/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /admin/realms/{realm}/users/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
          - inBody: credentials[?type=password].value
            inCustomResource: spec.credentials[?type=password].valueSecretRef
            resolver:
              type: secretRef
              secretRef:
                nameFromCustomResource: spec.credentials[?type=password].valueSecretRef.name
                keyFromCustomResource: spec.credentials[?type=password].valueSecretRef.key
          - inBody: credentials[?type=otp].secretData
            inCustomResource: spec.credentials[?type=otp].secretDataSecretRef
            resolver:
              type: secretRef
              secretRef:
                nameFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.name
                keyFromCustomResource: spec.credentials[?type=otp].secretDataSecretRef.key
      - action: delete
        method: DELETE
        path: /admin/realms/{realm}/users/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
{{- end }}
