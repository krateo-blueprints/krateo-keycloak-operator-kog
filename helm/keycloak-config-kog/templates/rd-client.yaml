{{- if .Values.restDefinitions.client.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-client
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-client/client.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ .Values.restDefinitions.client.kind }}
    # `clientId` is the user-supplied natural key; Keycloak addresses the
    # resource by a server-generated UUID. `findby` lists the collection and
    # matches clientId to resolve {id} (written to status) for get/update/delete.
    identifiers:
      - clientId
    additionalStatusFields:
      - id
    # `id` is the server-generated UUID: it is a required path param on
    # get/update/delete but must NOT be a user-set spec field. Exclude it from
    # the spec and source it from status (populated by findby) via
    # requestFieldMapping. {realm} stays a normal (required) spec field.
    # NOTE: path params must be declared at the OPERATION level in the OAS asset
    # — oasgen-provider ignores path-item-level parameters.
    excludedSpecFields:
      - id
    verbsDescription:
      - action: findby
        method: GET
        path: /admin/realms/{realm}/clients
      # A confidential client's SECRET is secret-sourced via RDC secretRef: the CR carries only
      # clientSecretRef {name,key}, and the controller writes the Secret's value into `secret` on
      # create and update, so it never sits in the CR spec (same contract as KeycloakUser and
      # KeycloakIdentityProvider). Guarded on its own presence (resolver.when, oasgen >= 0.56.0):
      # public clients need no Secret; a declared ref that cannot be read fails the request loudly.
      - action: create
        method: POST
        path: /admin/realms/{realm}/clients
        fieldMapping:
          - inBody: secret
            inCustomResource: spec.clientSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.clientSecretRef
              secretRef:
                nameFromCustomResource: spec.clientSecretRef.name
                keyFromCustomResource: spec.clientSecretRef.key
      - action: get
        method: GET
        path: /admin/realms/{realm}/clients/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /admin/realms/{realm}/clients/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
          - inBody: secret
            inCustomResource: spec.clientSecretRef
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.clientSecretRef
              secretRef:
                nameFromCustomResource: spec.clientSecretRef.name
                keyFromCustomResource: spec.clientSecretRef.key
      - action: delete
        method: DELETE
        path: /admin/realms/{realm}/clients/{id}
        fieldMapping:
          - inPath: id
            inCustomResource: status.id
{{- end }}
