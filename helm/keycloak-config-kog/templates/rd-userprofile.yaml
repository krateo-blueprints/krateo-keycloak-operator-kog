{{- if .Values.restDefinitions.userprofile.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-userprofile
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-userprofile/userprofile.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ .Values.restDefinitions.userprofile.kind }}
    # A realm's declarative user profile: one document per realm that always exists. No create
    # and no delete verb, so the kind adopts the realm's profile and replaces it (PUT) whenever
    # the CR differs. Deleting the CR leaves the realm's profile as it is. Parent scope: {realm},
    # which is also the only key, so there are no identifiers.
    additionalStatusFields:
      - unmanagedAttributePolicy
    verbsDescription:
      - action: get
        method: GET
        path: /admin/realms/{realm}/users/profile
      - action: update
        method: PUT
        path: /admin/realms/{realm}/users/profile
{{- end }}
