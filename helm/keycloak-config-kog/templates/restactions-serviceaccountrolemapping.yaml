{{- $kogRD := include "keycloak-config-kog.restDefinitions" . | fromYaml }}
{{- if $kogRD.serviceaccountrolemapping.enabled }}
{{- /*
Snowplow RESTActions backing the KeycloakServiceAccountRoleMapping RestDefinition
(observeApiRef / createApiRef + updateApiRef / deleteApiRef - see rd-serviceaccountrolemapping.yaml).

Request context (extras) from rest-dynamic-controller on every invocation: name/namespace/uid of the
CR, the identifiers realm, clientId, roleClientId, and the whole `spec`. Extras seed the jq dict, so
stages reference them directly (`.realm`, `.clientId`, `.spec.roles`).

Resolution chain (linear, each stage dependsOn the previous one so the order is fixed):
  client  GET /clients?clientId=<clientId>             -> the client (exact clientId match in jq)
  rclient GET /clients?clientId=<roleClientId>         -> the role-owning client
  sa      GET /clients/<client.id>/service-account-user -> the service-account user
  mapping GET /users/<sa.id>/role-mappings/clients/<rclient.id> -> direct mappings (RoleRepresentation[])
An iterated stage templates its path/payload against its ITEM only, so every item carries realm and
the ids it needs. An iterator that yields [] skips the stage (the "does not apply" case).

All Keycloak calls go through the snowplow Endpoint-shaped Secret
`{{ .Values.snowplow.endpointSecretName }}`. Keycloak's mutation endpoints answer 204 with an EMPTY
body, which the JSON stage handler reports as a stage error - hence continueOnError + errorKey on
every mutation stage. Convergence is level-based: create/update are re-invoked until the observe
reports the declared set, and delete is finalizer-held until the get verification sees no mappings.
*/}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: {{ .Release.Name }}-serviceaccountrolemapping-observe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  api:
    # Every observe stage tolerates failure: a client that does not exist yet, or one without a
    # service account (Keycloak answers 400), must compose {found:false}, not fail the observe.
    - name: client
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.clientId|@uri) }'
      continueOnError: true
      errorKey: clientError
    - name: rclient
      dependsOn:
        name: client
        iterator: '[{realm: .realm, rcid: .roleClientId}]'
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.rcid|@uri) }'
      continueOnError: true
      errorKey: rclientError
    - name: sa
      dependsOn:
        name: rclient
        iterator: >-
          .clientId as $cid
          | ((([.client // [] | arrays | .[] | select(.clientId == $cid)])[0]) // null) as $c
          | if $c == null then [] else [{realm: .realm, id: $c.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients/" + .id + "/service-account-user" }'
      continueOnError: true
      errorKey: saError
    - name: mapping
      dependsOn:
        name: sa
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | if ($rc == null) or ($uid == null) then []
            else [{realm: .realm, uid: $uid, rid: $rc.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
      continueOnError: true
      errorKey: mappingError
  filter: |-
    .clientId as $cid
    | .roleClientId as $rcid
    | ((([.client // [] | arrays | .[] | select(.clientId == $cid)])[0]) // null) as $c
    | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
    | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
    | if ($c == null) or ($rc == null) or ($uid == null) or ((.mapping | type) != "array")
      then {found: false}
      else {found: true,
            userId: $uid,
            roleClientUuid: $rc.id,
            roles: ([.mapping[] | .name] | sort)}
      end
---
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: {{ .Release.Name }}-serviceaccountrolemapping-apply
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  api:
    # Create and update: add the declared roles that are missing, remove the held ones that are not
    # declared. The resolution stages carry NO continueOnError, so a hard failure truncates the chain
    # before any mutation (retried on the next reconcile). A client that does not exist yet resolves
    # to an empty list, every later iterator yields [], and the invocation is a no-op.
    - name: client
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.clientId|@uri) }'
    - name: rclient
      dependsOn:
        name: client
        iterator: '[{realm: .realm, rcid: .roleClientId}]'
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.rcid|@uri) }'
    - name: sa
      dependsOn:
        name: rclient
        iterator: >-
          .clientId as $cid
          | ((([.client // [] | arrays | .[] | select(.clientId == $cid)])[0]) // null) as $c
          | if $c == null then [] else [{realm: .realm, id: $c.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients/" + .id + "/service-account-user" }'
    # The role-owning client's roles, for the ids Keycloak requires alongside the names.
    - name: available
      dependsOn:
        name: sa
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | if $rc == null then [] else [{realm: .realm, rid: $rc.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients/" + .rid + "/roles" }'
    - name: mapping
      dependsOn:
        name: available
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | if ($rc == null) or ($uid == null) then []
            else [{realm: .realm, uid: $uid, rid: $rc.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
    # Missing = declared and not held. Only names that exist on the role-owning client can be sent;
    # an unknown name is left out here and keeps the observe reporting drift.
    - name: add
      dependsOn:
        name: mapping
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | ([.mapping // [] | arrays | .[] | .name]) as $held
          | ((.spec.roles // []) | unique) as $want
          | ([.available // [] | arrays | .[]
              | select(.name as $n | ($want | any(. == $n)) and (($held | any(. == $n)) | not))
              | {id, name}]) as $missing
          | if ($rc == null) or ($uid == null) or ($missing | length) == 0 then []
            else [{realm: .realm, uid: $uid, rid: $rc.id, roles: $missing}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      verb: POST
      headers:
        - "Content-Type: application/json"
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
      payload: '${ .roles }'
      continueOnError: true
      errorKey: addError
    # Extra = held and not declared, removed from the same snapshot.
    - name: remove
      dependsOn:
        name: add
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | ((.spec.roles // []) | unique) as $want
          | ([.mapping // [] | arrays | .[]
              | select(.name as $n | ($want | any(. == $n)) | not)
              | {id, name}]) as $extra
          | if ($rc == null) or ($uid == null) or ($extra | length) == 0 then []
            else [{realm: .realm, uid: $uid, rid: $rc.id, roles: $extra}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      verb: DELETE
      headers:
        - "Content-Type: application/json"
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
      payload: '${ .roles }'
      continueOnError: true
      errorKey: removeError
  filter: '{}'
---
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: {{ .Release.Name }}-serviceaccountrolemapping-delete
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  api:
    # Remove every direct mapping of the role-owning client's roles (the CR owns that whole set).
    # An already-gone client or service account resolves to nothing: the delete is a no-op and the
    # get verification (404, or an empty list) releases the finalizer.
    - name: client
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.clientId|@uri) }'
      continueOnError: true
      errorKey: clientError
    - name: rclient
      dependsOn:
        name: client
        iterator: '[{realm: .realm, rcid: .roleClientId}]'
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients?clientId=" + (.rcid|@uri) }'
      continueOnError: true
      errorKey: rclientError
    - name: sa
      dependsOn:
        name: rclient
        iterator: >-
          .clientId as $cid
          | ((([.client // [] | arrays | .[] | select(.clientId == $cid)])[0]) // null) as $c
          | if $c == null then [] else [{realm: .realm, id: $c.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/clients/" + .id + "/service-account-user" }'
      continueOnError: true
      errorKey: saError
    - name: mapping
      dependsOn:
        name: sa
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | if ($rc == null) or ($uid == null) then []
            else [{realm: .realm, uid: $uid, rid: $rc.id}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
      continueOnError: true
      errorKey: mappingError
    - name: del
      dependsOn:
        name: mapping
        iterator: >-
          .roleClientId as $rcid
          | ((([.rclient // [] | arrays | .[] | select(.clientId == $rcid)])[0]) // null) as $rc
          | (if (.sa | type) == "object" then (.sa.id // null) else null end) as $uid
          | ([.mapping // [] | arrays | .[] | {id, name}]) as $held
          | if ($rc == null) or ($uid == null) or ($held | length) == 0 then []
            else [{realm: .realm, uid: $uid, rid: $rc.id, roles: $held}] end
      endpointRef:
        name: {{ .Values.snowplow.endpointSecretName }}
        namespace: {{ .Release.Namespace }}
      verb: DELETE
      headers:
        - "Content-Type: application/json"
      path: '${ "/admin/realms/" + .realm + "/users/" + .uid + "/role-mappings/clients/" + .rid }'
      payload: '${ .roles }'
      continueOnError: true
      errorKey: deleteError
  filter: '{}'
{{- end }}
