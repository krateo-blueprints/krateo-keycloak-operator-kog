{{- if and .Values.auth.externalSecret.enabled .Values.auth.bootstrap.enabled }}
{{- /*
Copies the blueprint's bootstrap admin service-account Secret (client-id, client-secret) from the
Keycloak namespace into this release's namespace, so the token generator (externalsecret.yaml) can
read it: ESO generators only read Secrets in their own namespace.

Least privilege: the store's ServiceAccount may `get` exactly ONE Secret, by name, in the Keycloak
namespace. Nothing else in that namespace is readable through it.
*/ -}}
{{- $src := required "auth.bootstrap.namespace is required when auth.bootstrap.enabled (the namespace of the blueprint's Keycloak)" .Values.auth.bootstrap.namespace }}
{{- $name := printf "%s-bootstrap" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-reader
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-reader
  namespace: {{ $src }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.auth.bootstrap.secretName }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-reader
  namespace: {{ $src }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $src }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $name }}-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-client
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $name }}
  target:
    name: {{ $name }}-client
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # ESO's Webhook generator reads only Secrets carrying this label.
          external-secrets.io/type: webhook
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ .Values.auth.bootstrap.secretName }}
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.auth.bootstrap.secretName }}
        property: client-secret
{{- end }}
