{{- $kogRD := include "keycloak-config-kog.restDefinitions" . | fromYaml }}
{{- if $kogRD.serviceaccountrolemapping.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-serviceaccountrolemapping
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-serviceaccountrolemapping/serviceaccountrolemapping.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ $kogRD.serviceaccountrolemapping.kind }}
    # The EXACT set of one client's roles (roleClientId) held by another client's service-account
    # user (clientId). Keycloak addresses both only by server UUIDs and has no set-replace call
    # (POST adds, DELETE removes the roles in its body), so all four lifecycle verbs are DELEGATED
    # to Snowplow RESTActions (templates/restactions-serviceaccountrolemapping.yaml) that resolve
    # the UUIDs by clientId and add the missing roles / remove the extra ones. The OAS verbs below
    # exist for CRD generation (create body = spec shape), for the CEL rule that a createApiRef
    # needs a get or findby, and for finalizer-verified deletion.
    identifiers:
      - realm
      - clientId
      - roleClientId
    additionalStatusFields:
      - found
      - userId
      - roleClientUuid
      - roles
    # Server-generated path params, resolved from status: never part of the spec.
    excludedSpecFields:
      - userId
      - roleClientUuid
    verbsDescription:
      - action: create
        method: POST
        path: /admin/realms/{realm}/users/{userId}/role-mappings/clients/{roleClientUuid}
      # Exercised only by delete verification: after the delete RESTAction runs, the finalizer is
      # released once this GET answers an empty mapping list (notFoundBody) or 404 (the client, and
      # with it its service-account user, is gone). Observation is delegated to observeApiRef.
      - action: get
        method: GET
        path: /admin/realms/{realm}/users/{userId}/role-mappings/clients/{roleClientUuid}
        fieldMapping:
          - inPath: userId
            inCustomResource: status.userId
          - inPath: roleClientUuid
            inCustomResource: status.roleClientUuid
        notFoundBody:
          inline: '(type == "array") and (length == 0)'
    # Observe: resolve the client, its service-account user and the role-owning client by clientId,
    # read the direct mappings, compose {found,userId,roleClientUuid,roles(sorted)}.
    observeApiRef:
      name: {{ .Release.Name }}-serviceaccountrolemapping-observe
      namespace: {{ .Release.Namespace }}
      # Absent => create: the client, its service account or the role-owning client is not
      # resolvable yet. The create RESTAction is then a no-op and is re-invoked each reconcile
      # until the client exists, after which the drift path takes over.
      notFoundExpr:
        inline: '(.status.found // false) | not'
      # Drift => update: the held set differs from the declared set (extra OR missing role).
      upToDateExpr:
        inline: '((.status.roles // []) | sort) == ((.spec.roles // []) | unique)'
    # Create and update are the same idempotent convergence: add missing, remove extra.
    createApiRef:
      name: {{ .Release.Name }}-serviceaccountrolemapping-apply
      namespace: {{ .Release.Namespace }}
    updateApiRef:
      name: {{ .Release.Name }}-serviceaccountrolemapping-apply
      namespace: {{ .Release.Namespace }}
    deleteApiRef:
      name: {{ .Release.Name }}-serviceaccountrolemapping-delete
      namespace: {{ .Release.Namespace }}
{{- end }}
