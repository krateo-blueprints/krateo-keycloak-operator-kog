# Canonical chart release workflow — krateo-platformops, krateo-agentiko, krateo-blueprints.
#
# Identical in every repository that ships a chart. Two invariants it enforces:
#
#   layout   every chart lives at helm/<chart-name>/
#   tags     bare semver only: 0.3.39   (not v0.3.39, not name-0.1.0, not path/0.1.0)
#
# PUBLISHES ONLY WHAT CHANGED since the previous semver tag. A repo with 250 charts must
# not republish 250 artifacts because one line moved: that is minutes of CI, 250 registry
# writes, and 249 version bumps that contain no change. A chart's version is therefore the
# tag at which that chart last actually changed, so charts within a repo legitimately sit
# at different versions — which is how they are already consumed (the installer pins each
# component independently).
#
# Conservative by design: when the diff cannot be attributed confidently — no previous tag,
# or a change outside helm/ that any chart might depend on — it publishes EVERYTHING.
# Over-publishing is noise; under-publishing silently ships a stale chart.
#
# The same bytes are then published to the Marketplace index by the organisation's one publisher
# (krateo-blueprints/charts PUBLISHING.md). The chart carries values.schema.json and this repo's
# CompositionDefinition, so it is a blueprint and goes to the `blueprints` channel.

name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  # contents: write -- the stamped CompositionDefinition is attached to the release;
  # it is applied by hand and is not inside the packaged chart, so a copy that only
  # exists in the runner helps nobody.
  contents: write
  packages: write
  actions: read # the lint-run check reads this repository's workflow runs

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The blueprint chart: it has values.schema.json, and the repo-root
      # compositiondefinition.yaml installs it (PUBLISHING.md rule 2). It is this repo's only
      # chart, so the selection always includes it. Job-level, because the packaging step copies
      # the CompositionDefinition into it and the release-asset step must skip that same copy:
      # one definition, so the two can't drift apart.
      BLUEPRINT_DIR: helm/keycloak-config-kog
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # need history to diff against the previous tag

      # Refuse to release a commit no lint run ever passed on (PUBLISHING.md rule 10). A quiet
      # check list reads as success, so the never-triggered case is made loud here, the last point
      # before the charts are published. This asserts only what it can see: that THIS commit has a
      # concluded, successful run of lint.yaml. lint.yaml runs on pushes to main, so a merged
      # commit has one; a squash merge's history does not record what ran on the branch.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/lint.yaml/runs?head_sha=${SHA}&per_page=100"
          runs="$(gh api "$runs_url" --jq '[.workflow_runs[] | select(.status == "completed")] | length')"
          ok="$(gh api "$runs_url" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "lint runs on ${SHA}: ${runs} completed, ${ok} successful"
          if [ "$runs" -eq 0 ]; then
            echo "::error::No completed lint run exists for ${SHA}. This is the never-triggered case, not"
            echo "::error::a pending one. Dispatch lint.yaml on this commit, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::lint ran on ${SHA} but never succeeded. Refusing to publish."
            exit 1
          fi

      # The Marketplace installs what the helm index at krateo-blueprints/charts lists, not what
      # GHCR holds, and the publish-index job below needs this secret to get there. Refuse here,
      # before anything is pushed, so a missing token fails the release instead of leaving GHCR
      # and the index at different versions (PUBLISHING.md rules 1 and 7).
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index and the Marketplace would keep installing an old version."
            exit 1
          fi
          # A token with whitespace or a control character (usually a trailing newline from piping
          # into `gh secret set`) passes the API, which trims it, and then breaks git in the
          # publisher, after GHCR already holds this version (PUBLISHING.md rule 7). Refuse it
          # here. The token itself is never printed.
          case "${CHARTS_PUBLISH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::secret CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a trailing newline."
              echo "::error::Re-save it by pasting the token at the prompt of 'gh secret set CHARTS_PUBLISH_TOKEN --org krateo-blueprints --visibility all' (not piped from echo)."
              exit 1 ;;
          esac

      - uses: azure/setup-helm@v5

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          # Owner-derived, so transferring a repo between orgs retargets automatically.
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Enforce the layout invariant
        run: |
          set -euo pipefail
          stray=$(find . -name Chart.yaml -not -path './.git/*' -not -path './helm/*' \
                       -not -path '*/charts/*' | head -5)
          if [ -n "$stray" ]; then
            echo "::error::charts must live at helm/<chart-name>/ — found outside helm/:"
            echo "$stray" | sed 's/^/  /'
            exit 1
          fi
          [ -d helm ] || { echo "::error::no helm/ directory"; exit 1; }

      - name: Select charts to publish
        run: |
          set -euo pipefail
          prev=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                 | grep -v "^${VERSION}$" | head -1 || true)

          publish_all() { find helm -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; ; }

          if [ -z "$prev" ]; then
            echo "no previous semver tag — publishing every chart"
            publish_all > /tmp/charts.txt
          else
            echo "diffing against ${prev}"
            changed=$(git diff --name-only "${prev}..${VERSION}")
            # A change anywhere outside helm/ (shared CI, toolkit, root values) may affect
            # any chart. Cannot attribute it, so publish everything.
            if echo "$changed" | grep -qv '^helm/'; then
              echo "changes outside helm/ — publishing every chart (conservative)"
              publish_all > /tmp/charts.txt
            else
              echo "$changed" | awk -F/ 'NF>=2 {print "helm/"$2}' | sort -u \
                | while read -r d; do [ -f "$d/Chart.yaml" ] && echo "$d"; done > /tmp/charts.txt
            fi
          fi

          n=$(wc -l < /tmp/charts.txt | tr -d ' ')
          echo "selected ${n} chart(s):"
          sed 's/^/  /' /tmp/charts.txt
          # Publishing nothing on a release tag is almost always a mistake worth failing on.
          [ "$n" -gt 0 ] || { echo "::error::tag ${VERSION} changes no chart"; exit 1; }

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Stamp every CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of THIS chart and does not live next to Chart.yaml, so the
          # per-chart stamping below never saw it. Left by hand it registered 0.1.0, which was
          # never published; core-provider accepts a stale registration silently.
          found=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"; found=$((found+1))
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "CompositionDefinitions stamped: $found"

      - name: Package and push
        run: |
          set -euo pipefail
          # Refuse here, before GHCR holds the version, every archive the Marketplace index's publisher
          # would refuse after it (PUBLISHING.md rules 2 and 3): the same checks, on the same archive.
          # helm package exits 0 whether or not a file made it into the chart, so the archive is what is
          # checked. Listings are read once and matched with here-strings: `tar | grep -q` under
          # pipefail fails on SIGPIPE when grep matches early.
          gate() {
            local name="$1" tgz="$2" channel="$3" members chart_yaml chart_ver src src_lc listed want kind f
            local cd_yaml cd_url cd_ver
            members="$(tar tzf "$tgz")"
            chart_yaml="$(tar -xzOf "$tgz" "${name}/Chart.yaml")"
            chart_ver="$(yq -r '.version' <<< "$chart_yaml")"
            src="https://github.com/${GITHUB_REPOSITORY}"
            # Owner and repository names are case-insensitive on GitHub, so compare lower-cased and
            # ignore a trailing slash, exactly as the publisher does (publish-chart.yaml 1.0.3).
            src_lc="$(tr '[:upper:]' '[:lower:]' <<< "$src")"
            listed="$(yq -r '.sources // [] | .[]' <<< "$chart_yaml" | tr '[:upper:]' '[:lower:]' | sed 's#/*$##')"
            if ! grep -qxF "$src_lc" <<< "$listed"; then
              echo "::error::${name}: Chart.yaml sources: must list ${src}, the repository that builds it"
              return 1
            fi
            if [ "$channel" != operators ]; then
              for f in values.schema.json compositiondefinition.yaml; do
                if ! grep -qxF "${name}/${f}" <<< "$members"; then
                  echo "::error::$(basename "$tgz") lacks ${name}/${f}"
                  return 1
                fi
              done
            fi
            want=operators
            if grep -qxF "${name}/values.schema.json" <<< "$members" \
               && grep -qxF "${name}/compositiondefinition.yaml" <<< "$members"; then
              kind="$(yq -r '.annotations."krateo.io/kind" // ""' <<< "$chart_yaml")"
              if [ "$kind" = page-set ]; then want=pages; else want=blueprints; fi
            fi
            if [ "$want" != "$channel" ]; then
              echo "::error::${name}: its archive belongs in ${want}, not ${channel} (PUBLISHING.md rule 2)"
              return 1
            fi
            if [ "$channel" = operators ]; then
              return 0
            fi
            cd_yaml="$(tar -xzOf "$tgz" "${name}/compositiondefinition.yaml")"
            cd_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' <<< "$cd_yaml")"
            cd_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' <<< "$cd_yaml")"
            if [ "$cd_url" != "oci://ghcr.io/krateo-blueprints/charts/${name}" ]; then
              echo "::error::${name}: its CompositionDefinition installs '${cd_url}', not oci://ghcr.io/krateo-blueprints/charts/${name}"
              return 1
            fi
            if [ "$cd_ver" != "$chart_ver" ]; then
              echo "::error::${name} ${chart_ver}: its CompositionDefinition installs version '${cd_ver}' (PUBLISHING.md rule 4)"
              return 1
            fi
            case "$(yq -r '.icon // ""' <<< "$chart_yaml")" in
              https://*) : ;;
              *) echo "::error::${name}: Chart.yaml icon must be an absolute https URL"; return 1 ;;
            esac
            if [ "$(yq -r '(.keywords // []) | length' <<< "$chart_yaml")" -eq 0 ]; then
              echo "::error::${name}: Chart.yaml needs keywords, the Marketplace's tags"
              return 1
            fi
          }

          # Every chart goes to the index as well as GHCR (PUBLISHING.md rule 1), so a chart this
          # workflow has no channel for is refused before anything is pushed, not pushed alone.
          others="$(find helm -mindepth 2 -maxdepth 2 -name Chart.yaml -not -path "${BLUEPRINT_DIR}/Chart.yaml")"
          if [ -n "$others" ]; then
            echo "::error::no index channel for: ${others//$'\n'/ }. Route it in this workflow before releasing."
            exit 1
          fi
          # A blueprint archive must describe itself (PUBLISHING.md rule 3): ship the stamped
          # CompositionDefinition inside the chart, at the chart root where helm packages it but
          # never renders it. Copied, not moved: the root file stays the source for the release
          # asset below, and it was stamped by the step above, so both carry the tag version.
          cp ./compositiondefinition.yaml "${BLUEPRINT_DIR}/compositiondefinition.yaml"
          mkdir -p charts-dist
          while read -r dir; do
            [ -z "$dir" ] && continue
            cf="$dir/Chart.yaml"
            name=$(grep -E '^name:' "$cf" | head -1 | awk '{print $2}')
            # The chart name is the public contract; the directory must match it so a
            # reader can find the source of oci://.../charts/<name> without grepping.
            [ "$name" = "$(basename "$dir")" ] || {
              echo "::error::${cf}: name '${name}' != directory '$(basename "$dir")'"; exit 1; }

            # CHART_VERSION placeholder is substituted from the tag; never hand-maintained.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"
            helm dependency build "$dir" 2>/dev/null || helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination /tmp/pkg
            tgz="/tmp/pkg/${name}-${VERSION}.tgz"
            gate "$name" "$tgz" blueprints || exit 1
            helm push "$tgz" "${OCI_REPO}"
            echo "pushed ${name}:${VERSION}"
            # The same bytes that went to GHCR, for the index.
            cp "$tgz" charts-dist/
          done < /tmp/charts.txt

      - name: Hand the blueprint tarball to the index job
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: charts-dist/*.tgz
          if-no-files-found: error

      - name: Verify anonymous pullability
        run: |
          set -uo pipefail
          # New GHCR packages default to PRIVATE and do not inherit visibility across orgs.
          # core-provider pulls anonymously in-cluster, so a private package fails at
          # provisioning with an opaque error. Fail loudly here instead.
          fail=0
          while read -r dir; do
            [ -z "$dir" ] && continue
            name=$(basename "$dir")
            repo="${GITHUB_REPOSITORY_OWNER,,}/charts/${name}"
            tok=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
                   -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                   "https://ghcr.io/v2/${repo}/manifests/${VERSION}")
            if [ "$code" = "200" ]; then
              echo "  ${name}: public"
            else
              echo "::warning::${name} is NOT anonymously pullable (HTTP ${code}) — set the package public"
              fail=1
            fi
          done < /tmp/charts.txt
          exit 0   # warn, don't block: visibility is a one-time manual step per package

      - name: Publish the stamped CompositionDefinitions on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs AFTER the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Staged copies -- a root-level CD cp'd onto itself is
          # an error, not a no-op (both lessons from krateo-selfservice-blueprint 0.2.26).
          # The chart's own compositiondefinition.yaml is the packaging step's copy of the root
          # file, not a second CompositionDefinition, so it is not attached again.
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' \
                        -not -path "./${BLUEPRINT_DIR}/compositiondefinition.yaml" -print0)
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "${VERSION}" --notes "Apply the attached CompositionDefinition to register this version."
          gh release upload "${VERSION}" "${assets[@]}" --clobber
          echo "attached: ${assets[*]}"

  # The Marketplace reads https://krateo-blueprints.github.io/charts/blueprints/index.yaml and
  # installs the version its entry names. How every chart in the organisation gets there is decided
  # once, in krateo-blueprints/charts PUBLISHING.md, and enforced by its publisher, which also reads
  # the served index and installs the chart anonymously before it succeeds.
  publish-index:
    needs: release
    # Pinned by full commit SHA (PUBLISHING.md rule 9); Dependabot proposes upgrades.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@1e6210ab2a8b66ff1a8d6da86287e671154f44a2 # 1.0.4
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
