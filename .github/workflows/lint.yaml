name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  # Every commit that reaches main gets a lint run, so release-tag can refuse a tag on a
  # commit that never passed lint (krateo-blueprints/charts PUBLISHING.md rule 10).
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Gating, unlike the informational step below: two silent-defect classes that no other check
      # sees. Chart URLs on the renamed krateoplatformops org (still answering through GitHub's
      # redirect), and additionalStatusFields absent from their response schema (silently empty
      # forever). Offline, with self-tests that run through the same functions as the real check.
      - name: Validate chart URLs and status fields
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          helm template release helm/keycloak-config-kog > "$RUNNER_TEMP/rendered.yaml"
          python3 hack/validate-chart.py helm/keycloak-config-kog "$RUNNER_TEMP/rendered.yaml" .

      # Gating. A release upgraded with `helm upgrade --reuse-values` keeps its OLD values, so keys added
      # since that release are ABSENT (nil), not defaulted. Templates must tolerate that: 0.5.0 crashed
      # with a nil pointer on .Values.auth.bootstrap.enabled for exactly this upgrade. Nulling the keys
      # added since 0.4.x reproduces that shape; the render must still succeed.
      - name: Render with keys added since 0.4.x absent (helm upgrade --reuse-values shape)
        run: |
          set -euo pipefail
          helm template release helm/keycloak-config-kog \
            --set auth.bootstrap=null --set executionIdentity=null > /dev/null
          echo "renders with auth.bootstrap and executionIdentity absent"

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
